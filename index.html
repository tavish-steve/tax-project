<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tax Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1>Tax Calculator</h1>

      <form id="taxform" class="mb-4">
        <div class="mb-3">
          <label for="basicSalary" class="form-label">Basic Salary</label>
          <input
            type="number"
            class="form-control"
            id="basic"
            required
          />
        </div>
        <div class="mb-3">
          <label for="benefits" class="form-label">Benefits</label>
          <input
            type="number"
            class="form-control"
            id="benefits"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary">Calculate</button>
      </form>

      <div id="results" class="alert alert-info"></div>

      <table class="table table-bordered mt-4">
        <thead>
          <tr>
            <th scope="col">TAX CATEGORY</th>
            <th scope="col">TAX VALUE</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Gross Salary</td>
            <td id="gross"></td>
          </tr>
          <tr>
            <td>NHIF</td>
            <td id="nhif"></td>
          </tr>
          <tr>
            <td>NSSF</td>
            <td id="nssf"></td>
          </tr>
          <tr>
            <td>NHDF</td>
            <td id="nhdf"></td>
          </tr>
          <tr>
            <td><strong>Taxable Income</strong></td>
            <td id="taxableIncome"></td>
          </tr>
          <tr>
            <td><strong>PAYEE (Tax)</strong></td>
            <td id="payee"></td>
          </tr>
          <tr>
            <td><strong>Net Pay</strong></td>
            <td id="netSalary"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <script src="tax.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
