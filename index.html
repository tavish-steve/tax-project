<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tax Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding-top: 2rem;
        padding-bottom: 2rem;
      }
      .card {
        border: none;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
      .card-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 15px 15px 0 0 !important;
        padding: 1.5rem;
      }
      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        padding: 12px 30px;
        font-weight: 600;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }
      .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.25rem rgba(102, 126, 234, 0.25);
      }
      .table {
        margin-bottom: 0;
      }
      .table thead th {
        background-color: #f8f9fa;
        border-color: #dee2e6;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.85rem;
        letter-spacing: 0.5px;
      }
      .table-hover tbody tr:hover {
        background-color: rgba(102, 126, 234, 0.05);
      }
      .alert-info {
        background-color: #e7f3ff;
        border: none;
        border-left: 4px solid #0d6efd;
        color: #0d6efd;
      }
      .result-value {
        font-weight: 700;
        color: #198754;
      }
      .result-label {
        font-weight: 600;
        color: #495057;
      }
      .total-row {
        background-color: #f8f9fa;
        font-weight: 700;
      }
      .input-group-text {
        background-color: #f8f9fa;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
          <div class="card">
            <div class="card-header text-center">
              <h2 class="mb-0">
                <i class="bi bi-calculator-fill me-2"></i>Tax Calculator
              </h2>
              <p class="mb-0 mt-2 opacity-75">Kenyan Net  pay Calculator</p>
            </div>
            <div class="card-body p-4">
              <form id="taxform" class="mb-4">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="basicSalary" class="form-label fw-semibold">Basic Salary</label>
                    <div class="input-group">
                      <span class="input-group-text">KES</span>
                      <input
                        type="number"
                        class="form-control"
                        id="basic"
                        placeholder="Enter basic salary"
                        required
                      />
                    </div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="benefits" class="form-label fw-semibold">Benefits</label>
                    <div class="input-group">
                      <span class="input-group-text">KES</span>
                      <input
                        type="number"
                        class="form-control"
                        id="benefits"
                        placeholder="Enter benefits"
                        required
                      />
                    </div>
                  </div>
                </div>
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                  <button type="reset" class="btn btn-outline-secondary me-md-2">
                    <i class="bi bi-arrow-counterclockwise me-1"></i>Reset
                  </button>
                  <button type="submit" class="btn btn-primary">
                    <i class="bi bi-calculator me-1"></i>Calculate Tax
                  </button>
                </div>
              </form>

              <div id="results" class="alert alert-info d-none" role="alert">
                <i class="bi bi-info-circle-fill me-2"></i>
                <span>Tax calculation completed successfully!</span>
              </div>

              <div class="table-responsive">
                <table class="table table-bordered table-hover">
                  <thead>
                    <tr class="text-center">
                      <th scope="col"><i class="bi bi-list-ul me-1"></i>Tax Category</th>
                      <th scope="col"><i class="bi bi-currency-dollar me-1"></i>Amount (KES)</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td><i class="bi bi-wallet2 me-2 text-primary"></i>Gross Salary</td>
                      <td id="gross" class="result-value text-end">-</td>
                    </tr>
                    <tr>
                      <td><i class="bi bi-heart-pulse me-2 text-danger"></i>NHIF</td>
                      <td id="nhif" class="text-end">-</td>
                    </tr>
                    <tr>
                      <td><i class="bi bi-shield-check me-2 text-info"></i>NSSF</td>
                      <td id="nssf" class="text-end">-</td>
                    </tr>
                    <tr>
                      <td><i class="bi bi-bank me-2 text-warning"></i>NHDF</td>
                      <td id="nhdf" class="text-end">-</td>
                    </tr>
                    <tr class="table-secondary">
                      <td><strong><i class="bi bi-cash-stack me-2"></i>Taxable Income</strong></td>
                      <td id="taxableIncome" class="result-label text-end">-</td>
                    </tr>
                    <tr class="total-row">
                      <td><strong><i class="bi bi-receipt me-2"></i>PAYEE (Tax)</strong></td>
                      <td id="payee" class="result-value text-end text-danger">-</td>
                    </tr>
                    <tr class="table-success">
                      <td><strong><i class="bi bi-wallet-fill me-2"></i>Net Pay</strong></td>
                      <td id="netSalary" class="result-value text-end">-</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
            <div class="card-footer text-center text-muted py-3">
              <small><i class="bi bi-info-circle me-1"></i>Based on Kenyan tax regulations</small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="tax.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
